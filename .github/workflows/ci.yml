name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
      - develop
      - tan
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend CI: Compile, Test & Package JAR
  # ==========================================
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wareflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Java & Test Classes
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run JUnit Tests
        run: ./gradlew test --no-daemon
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/wareflow?createDatabaseIfNotExist=true
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: wareflow-team8-super-secret-key-for-jwt-signing-2026-must-be-at-least-256-bits
          SEED_ENABLED: "false"

      - name: Build Spring Boot Executable JAR
        run: ./gradlew bootJar -x test --no-daemon

      - name: Upload Test Report (on test failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          retention-days: 7

      - name: Upload Backend Executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wareflow-backend-jar
          path: backend/build/libs/*.jar
          retention-days: 7

  # ==========================================
  # 2. Frontend CI: Lint, Type Check & Build
  # ==========================================
  frontend-ci:
    name: Frontend CI (Node 22 / Vite / React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend Application (TypeScript + Vite)
        run: npm run build

      - name: Upload Frontend Production Dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wareflow-frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ==========================================
  # 3. Docker Compose & Multi-stage Build Test
  # ==========================================
  docker-ci:
    name: Docker Build & Compose Sanity Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Multi-stage test)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: wareflow-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image (Multi-stage test)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: wareflow-frontend:ci
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
