services:

  # ---------- MySQL 8 ----------
  db:
    image: mysql:8.4
    container_name: wareflow-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-30063008}
      MYSQL_DATABASE: wareflow
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Cho phép truy cập MySQL từ máy local (tool quản lý DB)
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-30063008}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wareflow

  # ---------- Backend (Spring Boot) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wareflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Trong container, DB nằm ở service name "db"
      DB_URL: jdbc:mysql://db:3306/wareflow?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-30063008}
      JWT_SECRET: ${JWT_SECRET:-wareflow-team8-super-secret-key-for-jwt-signing-2026-must-be-at-least-256-bits}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@wareflow.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@wareflow.com}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-Owner@123}
    ports:
      - "8081:8081"
    networks:
      - wareflow

  # ---------- Frontend (Nginx) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: wareflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - wareflow

volumes:
  db-data:
    name: wareflow-db-data

networks:
  wareflow:
    name: wareflow-net
    driver: bridge
