spring.application.name=backend

server.port=8081
server.servlet.context-path=/

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wareflow?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:30063008}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Override các giá trị này qua biến môi trường trong môi trường production.
app.jwt.secret=${JWT_SECRET:wareflow-team8-super-secret-key-for-jwt-signing-2026-must-be-at-least-256-bits}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@wareflow.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.owner-email=${SEED_OWNER_EMAIL:owner@wareflow.com}
app.seed.owner-password=${SEED_OWNER_PASSWORD:Owner@123}

logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=info
