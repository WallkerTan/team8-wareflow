<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wareflow — Tài khoản</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');
    :root{--blue:#4169e8;--ink:#172b4d;--muted:#7d8da3;--line:#e3e9f2}
    *{box-sizing:border-box}
    body{margin:0;font-family:'DM Sans',Arial,sans-serif;color:var(--ink);background:#f3f7fb}
    .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#f6f9fc,#edf3ff)}
    .auth-card{width:min(100%,470px);padding:40px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 70px rgba(42,77,130,.14)}
    .auth-logo{justify-content:center;margin-bottom:36px}.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
    .logo>span{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:20px}.logo strong{font:800 22px Manrope}.logo strong span{color:var(--blue)}
    .auth-copy{margin-bottom:25px}.crumb{margin:0;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.12em}.auth-copy h1{margin:9px 0 8px;font:800 30px Manrope}.auth-copy>p:last-child{margin:0;color:var(--muted);line-height:1.6}
    .auth-card form{display:flex;flex-direction:column;gap:16px}.auth-card form>label:not(.check){display:flex;flex-direction:column;gap:8px;color:#516278;font-size:12px;font-weight:700}
    .auth-card input:not([type=checkbox]){width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:9px;outline:0;background:#fbfcfe;color:var(--ink);font:inherit}.auth-card input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4169e81a}
    .auth-row{display:flex;align-items:center;justify-content:space-between;font-size:12px}.auth-row a,.auth-foot a{color:var(--blue);font-weight:700;text-decoration:none}.check{display:flex!important;align-items:center;gap:8px;color:var(--muted)!important;font-size:12px!important;font-weight:500!important}.check input{accent-color:var(--blue)}
    .primary{border:0;border-radius:9px;padding:14px 18px;background:var(--blue);color:#fff;font:700 14px 'DM Sans';cursor:pointer}.primary:hover{background:#3158d5}.auth-submit{width:100%;margin-top:4px}.auth-foot{margin:24px 0 0;text-align:center;color:var(--muted);font-size:12px}
    @media(max-width:520px){.auth-card{padding:28px 22px}.auth-copy h1{font-size:26px}.auth-row{gap:12px;align-items:flex-start;flex-direction:column}}
  </style>
</head>
</html>
